name: collect-news
on:
  schedule:
    - cron: '0 21,3,9 * * *'   # KST 06:00 / 12:00 / 18:00
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Collect Jeju news
        run: python scripts/collect_news.py
      - name: Collect Jeju notices
        run: python scripts/collect_notices.py || true
      - name: Commit if changed
        run: |
          git config user.name  "mondak-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "news: auto-update $(date +'%Y-%m-%d %H:%M')"
          git push
