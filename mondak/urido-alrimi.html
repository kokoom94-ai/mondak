<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>우리 동네의원 알리미</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,-apple-system,sans-serif;background:#F7F8F6;color:#1C1E1B;
     display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{padding:13px 20px;background:#fff;border-bottom:1px solid #E4E6E1;display:flex;align-items:center;gap:12px}
h1{font-size:17px;font-weight:600;letter-spacing:-.02em}
.sub{font-size:12px;color:#6B6F66}
.tabs{margin-left:auto;display:flex;background:#EFF1EC;border-radius:8px;padding:3px;gap:2px}
.tabs button{border:0;background:none;font:inherit;font-size:13px;padding:6px 14px;border-radius:6px;cursor:pointer;color:#5A5E55}
.tabs button.on{background:#fff;color:#1C1E1B;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
main{flex:1;display:flex;min-height:0}
#mapwrap{flex:1;position:relative;min-width:0;overflow:hidden}
svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg.drag{cursor:grabbing}
.dist{stroke:#fff;cursor:pointer;transition:opacity .15s}
.dist:hover{opacity:.72}
.dist.sel{stroke:#1C1E1B}
#Lout,#Lin{pointer-events:none}
#Lout text,#Lin text{font-weight:600;fill:#2A2D27;text-anchor:middle;paint-order:stroke;stroke:#F7F8F6;stroke-linejoin:round}
.lead{stroke:#9AA093;fill:none} .dot{fill:#6B6F66} #Lin{display:none}
#inset{fill:none;stroke:#9AA093;stroke-dasharray:4 3}
#insetlab{fill:#6B6F66;text-anchor:middle;font-weight:500}
#zc{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:1px;
     background:#E4E6E1;border-radius:9px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.09)}
#zc button{width:38px;height:38px;border:0;background:#fff;font:inherit;font-size:17px;cursor:pointer;color:#3A3E36;line-height:1}
#zc button:active{background:#F0F1EE} #zc button:last-child{font-size:13px}
#hint{position:absolute;left:14px;bottom:16px;font-size:11.5px;color:#8A8F84;background:rgba(255,255,255,.86);padding:6px 10px;border-radius:7px}
aside{width:344px;background:#fff;border-left:1px solid #E4E6E1;padding:22px;overflow-y:auto}
.ph{color:#8A8F84;font-size:14px;line-height:1.7;padding-top:40px;text-align:center}
.dname{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
.dcity{font-size:12px;color:#6B6F66;margin-bottom:18px}
.card{border:1px solid #E4E6E1;border-radius:12px;padding:16px;margin-bottom:10px}
.did{font-size:11px;color:#8A8F84;letter-spacing:.04em;margin-bottom:5px}
.dn{font-size:14px;font-weight:600;margin-bottom:12px;color:#4A4E45}
.detail{font-size:11px;color:#8A8F84;line-height:1.6;margin-top:11px;padding-top:11px;border-top:1px solid #F0F1EE}
.note{font-size:12px;color:#6B6F66;background:#F0F4EE;border-radius:9px;padding:11px;margin-bottom:14px;line-height:1.6}
.mrow{display:flex;align-items:center;gap:12px}
.av{width:52px;height:52px;border-radius:10px;background:#EFF1EC;flex-shrink:0;object-fit:cover;
     display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:#8A8F84}
img.av{display:block}
.mn{font-size:16px;font-weight:600;letter-spacing:-.01em}
.mm{font-size:12px;color:#6B6F66;margin-top:3px;line-height:1.5}
.pty{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;color:#fff;margin-right:6px}
.bio{margin-top:12px;padding-top:12px;border-top:1px solid #F0F1EE;display:grid;
     grid-template-columns:52px 1fr;gap:6px 10px;font-size:12px;line-height:1.55}
.bio dt{color:#9AA093} .bio dd{color:#4A4E45}
.bio dd.cr{color:#4A4E45} .bio dd.cr span{display:block}
.bio dd.cr span+span{margin-top:3px}
.role{display:inline-block;font-size:11px;padding:3px 8px;border-radius:5px;background:#F0F4EE;color:#3F6B39;font-weight:600;margin-top:10px}
#prop{display:none;flex:1;overflow-y:auto;padding:24px;background:#F7F8F6}
body.pv #prop{display:block} body.pv #mapwrap,body.pv aside{display:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;max-width:1120px;margin:0 auto}
.pcard{background:#fff;border:1px solid #E4E6E1;border-radius:12px;padding:15px 16px}
.phead{max-width:1120px;margin:0 auto 16px;font-size:13px;color:#6B6F66;line-height:1.7}
img.av{cursor:zoom-in}
#lb{position:fixed;inset:0;z-index:50;background:rgba(20,22,19,.82);
    display:flex;align-items:center;justify-content:center;padding:24px;
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#lb[hidden]{display:none}
#lb figure{background:#fff;border-radius:14px;padding:14px;max-width:min(92vw,380px);
    box-shadow:0 18px 50px rgba(0,0,0,.35)}
#lbimg{display:block;width:100%;height:auto;border-radius:8px}
#lbcap{margin-top:11px;font-size:13px;color:#4A4E45;text-align:center;line-height:1.6}
#lbcap b{font-size:15px;font-weight:600;color:#1C1E1B}
#lbx{position:absolute;top:18px;right:18px;width:40px;height:40px;border:0;border-radius:50%;
    background:rgba(255,255,255,.16);color:#fff;font-size:17px;cursor:pointer;line-height:1}
footer{padding:9px 20px;background:#fff;border-top:1px solid #E4E6E1;font-size:11px;
  color:#8A8F84;line-height:1.6;text-align:center}
@media(max-width:820px){
  main{flex-direction:column}
  aside{width:auto;border-left:0;border-top:1px solid #E4E6E1;max-height:44vh;padding:18px}
  #hint{display:none} header{padding:11px 14px;gap:8px} h1{font-size:16px}
}

const PARTY={"더불어민주당": ["#152484", "민주"], "국민의힘": ["#E61E2B", "국힘"], "진보당": ["#D6001C", "진보"], "조국혁신당": ["#0073CF", "조국혁신"], "무소속": ["#6B6F66", "무소속"]};
const svg=document.getElementById('map'), panel=document.getElementById('panel'),
      Lout=document.getElementById('Lout'), Lin=document.getElementById('Lin'),
      inset=document.getElementById('inset'), ilab=document.getElementById('insetlab'),
      st=document.createElement('style'); document.head.appendChild(st);
const V="-60 -120 1320 1016".split(' ').map(Number);
const BASE={x:V[0],y:V[1],w:V[2],h:V[3]};
let vb={...BASE}, sel=null;

function render(){
  const k=BASE.w/vb.w;
  svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  Lout.setAttribute('font-size',13/k); Lin.setAttribute('font-size',13/k); ilab.setAttribute('font-size',11/k);
  st.textContent=`.dist{stroke-width:${1.6/k}px}.dist.sel{stroke-width:${3/k}px}`+
    `#Lout text,#Lin text{stroke-width:${3.5/k}px}.lead{stroke-width:${1/k}px;stroke-dasharray:${2.5/k} ${2.5/k}}`+
    `.dot{r:${2.4/k}px}#inset{stroke-width:${1.2/k}px}`;
  const z=k>1.9;
  Lout.style.display=z?'none':''; Lin.style.display=z?'block':'none';
  inset.style.opacity=ilab.style.opacity=z?.35:1;
}
function zoomAt(f,cx,cy){
  const nw=Math.min(BASE.w*1.05,Math.max(BASE.w/14,vb.w/f)), r=nw/vb.w;
  vb={x:cx-(cx-vb.x)*r, y:cy-(cy-vb.y)*r, w:nw, h:vb.h*r}; render();
}
function pt(e){const r=svg.getBoundingClientRect();
  return {x:vb.x+(e.clientX-r.left)/r.width*vb.w, y:vb.y+(e.clientY-r.top)/r.height*vb.h};}

function avatar(m){
  if(!m.photo) return `<div class="av">${m.name[0]}</div>`;
  return `<img class="av" src="${m.photo}" alt="${m.name} 의원 사진"
    data-nm="${m.name}${m.hanja?' '+m.hanja:''}" data-sb="${m.district||m.party}">`;
}
function bio(m){
  const r=[];
  if(m.birth)r.push(['생년',m.birth.replace(/\./g,'. ')+(m.sex?` · ${m.sex}`:'')]);
  if(m.job)r.push(['직업',m.job]);
  if(m.edu)r.push(['학력',m.edu]);
  if(m.career&&m.career.length)r.push(['경력',
    `<span>`+m.career.join('</span><span>')+`</span>`,'cr']);
  if(m.vote)r.push([m.rank?'순번':'득표',m.vote]);
  return r.length?`<dl class="bio">`+r.map(a=>`<dt>${a[0]}</dt><dd class="${a[2]||''}">${a[1]}</dd>`).join('')+`</dl>`:'';}
function mrow(m,full){const p=PARTY[m.party]||['#6B6F66',m.party];
  return `<div class="mrow">${avatar(m)}<div>
    <div class="mn"><span class="pty" style="background:${p[0]}">${p[1]}</span>${m.name}${m.hanja?`<span style="font-size:12px;color:#9AA093;font-weight:400;margin-left:5px">${m.hanja}</span>`:''}</div>
    <div class="mm">${m.committee||'상임위 미배정'}${m.run_committee?'<br>의회운영위원회 겸임':''}</div>
  </div></div>${m.role?`<div class="role">${m.role}</div>`:''}${full?bio(m):''}`;}

function select(p){
  if(sel)sel.classList.remove('sel'); p.classList.add('sel'); sel=p;
  const ds=META[p.id.slice(2)]||[];
  let h=`<div class="dname">${p.dataset.label}</div>
         <div class="dcity">${ds[0]?.city||''} · 도의원 ${ds.length}명</div>`;
  if(ds.length>1)h+=`<div class="note">이 지역은 갑·을 선거구로 나뉘어 도의원이 2명입니다. 통·리에 따라 소속 선거구가 다릅니다.</div>`;
  ds.forEach(d=>{h+=`<div class="card"><div class="did">${d.id}</div><div class="dn">${d.name}</div>
    ${mrow(d.m,1)}${d.detail?`<div class="detail">${d.detail}</div>`:''}</div>`;});
  panel.innerHTML=h;
  if(innerWidth<=820) panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* 포인터: 캡처가 click을 가로채므로 down/up 좌표차로 직접 판정 */
const ptrs=new Map(); let last=null, pd=0, downT=null, downXY=null;
svg.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,e);
  if(ptrs.size===1){
    svg.setPointerCapture(e.pointerId);
    downT=e.target.closest?e.target.closest('.dist'):null;
    downXY=[e.clientX,e.clientY]; last=pt(e); svg.classList.add('drag');
  } else downT=null;
});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return; ptrs.set(e.pointerId,e);
  const a=[...ptrs.values()];
  if(a.length>=2){
    const d=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY);
    if(pd){const r=svg.getBoundingClientRect();
      zoomAt(d/pd, vb.x+((a[0].clientX+a[1].clientX)/2-r.left)/r.width*vb.w,
                   vb.y+((a[0].clientY+a[1].clientY)/2-r.top)/r.height*vb.h);}
    pd=d; downT=null; return;
  }
  if(!last)return;
  const p=pt(e); vb.x-=p.x-last.x; vb.y-=p.y-last.y; render();
});
function up(e){
  const wasT=downT, xy=downXY;
  ptrs.delete(e.pointerId); if(ptrs.size<2)pd=0;
  if(!ptrs.size){last=null; svg.classList.remove('drag');}
  if(wasT&&xy&&Math.hypot(e.clientX-xy[0],e.clientY-xy[1])<6) select(wasT);
  downT=null; downXY=null;
}
svg.addEventListener('pointerup',up);
svg.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);downT=null;last=null;pd=0;svg.classList.remove('drag');});
svg.addEventListener('wheel',e=>{e.preventDefault();const p=pt(e);zoomAt(e.deltaY<0?1.22:1/1.22,p.x,p.y);},{passive:false});
zi.onclick=()=>zoomAt(1.5,vb.x+vb.w/2,vb.y+vb.h/2);
zo.onclick=()=>zoomAt(1/1.5,vb.x+vb.w/2,vb.y+vb.h/2);
zr.onclick=()=>{vb={...BASE};render();};

  `<div class="phead">비례대표는 특정 선거구에 속하지 않고 정당 득표율에 따라 배분됩니다. 제13대 도의회 비례대표는 13명입니다.</div><div class="pgrid">`
  +PROP.map(m=>`<div class="pcard">${mrow(m,1)}</div>`).join('')+`</div>`;
t1.onclick=()=>{document.body.classList.remove('pv');t1.classList.add('on');t2.classList.remove('on');};
t2.onclick=()=>{document.body.classList.add('pv');t2.classList.add('on');t1.classList.remove('on');};
const lb=document.getElementById('lb'),lbimg=document.getElementById('lbimg'),lbcap=document.getElementById('lbcap');
document.addEventListener('click',e=>{
  const im=e.target.closest('img.av');
  if(im){lbimg.src=im.src; lbimg.alt=im.alt;
    lbcap.innerHTML=`<b>${im.dataset.nm||''}</b><br>${im.dataset.sb||''}`;
    lb.hidden=false; return;}
  if(!lb.hidden && (e.target===lb||e.target.id==='lbx')) lb.hidden=true;
});
addEventListener('keydown',e=>{ if(e.key==='Escape') lb.hidden=true; });
render();
</script></body></html>
