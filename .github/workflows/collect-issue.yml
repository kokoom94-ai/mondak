name: 제주관광 여론 수집

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21,9 * * *'   # 06:00 / 18:00 KST

permissions:
  contents: write

concurrency:
  group: collect-issue
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 여론 수집·분류
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python scripts/collect_issue.py
      - name: 여론지수 산출
        run: python scripts/index_calc.py
      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/issue.json data/issue_index.json data/issue_history.json
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "여론 수집 $(date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "재시도 $i"; sleep 5
          done
          echo "푸시 실패" && exit 1
