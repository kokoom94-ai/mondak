name: 학교정보 수집 (학교알리미)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 1 * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 학교정보 수집
        env:
          SCHOOLINFO_API_KEY: ${{ secrets.SCHOOLINFO_API_KEY }}
        run: python scripts/collect_schools.py
      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schools.json
          git diff --staged --quiet || git commit -m "학교정보 자동 수집 $(date +'%Y-%m-%d')"
          git push
