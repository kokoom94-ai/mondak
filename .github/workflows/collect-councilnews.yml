name: 도의회 보도 수집

# 제주도의회 관련 보도를 의원별로 누적 수집한다.
# news.json은 2주치만 보관해 과거 기사가 없어, 이 수집기가 따로 쌓는다.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'   # 매일 05:00 KST

permissions:
  contents: write

concurrency:
  group: collect-councilnews
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 도의회 보도 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          CN_FROM: '2026-07-01'
        run: python scripts/collect_councilnews.py
      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/councilnews.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "도의회 보도 갱신 ($(date +%Y-%m-%d))"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push 재시도 $i"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME:-main} || true
            sleep 3
          done
          echo "push 실패 — 다음 실행에서 다시 시도합니다"
          exit 0
