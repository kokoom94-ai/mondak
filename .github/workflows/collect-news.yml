name: collect-news
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect Jeju news
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
        run: python scripts/collect_news.py || true
      - name: Collect Jeju notices
        env:
          GOV24_KEY: ${{ secrets.GOV24_KEY }}
        run: python scripts/collect_notices.py || true
      - name: Collect Jeju laws
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: python scripts/collect_laws.py || true
      - name: Collect Jeju assembly
        env:
          ASM_MEMBER_KEY: ${{ secrets.ASM_MEMBER_KEY }}
          ASM_BILL_KEY: ${{ secrets.ASM_BILL_KEY }}
          ASM_PROC_KEY: ${{ secrets.ASM_PROC_KEY }}
        run: python scripts/collect_assembly.py || true
      - name: Collect Jeju stats
        run: python scripts/collect_stats.py || true
      - name: Collect Jeju council
        env:
          CLIK_KEY: ${{ secrets.CLIK_KEY }}
        run: python scripts/collect_council.py || true
      - name: Collect VisitJeju
        env:
          VISITJEJU_KEY: ${{ secrets.VISITJEJU_KEY }}
        run: node collect-visitjeju.js || true
      - name: Commit results
        run: |
          git config user.name "mondak-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "자동 수집 $(date -u +'%Y-%m-%d %H:%M')"
          # 충돌에 강한 push: 최대 5회 재시도, 원격 갱신분은 우리 데이터 우선(-X ours)으로 병합
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "✅ push 성공 (시도 $i)"
              exit 0
            fi
            echo "⚠ push 거부됨 — 원격 변경 병합 후 재시도 ($i/5)"
            git fetch origin main
            # data/*.json은 방금 수집한 우리 것을 우선 채택하여 충돌 자동 해소
            git merge -X ours --no-edit origin/main || {
              git checkout --ours -- data/*.json 2>/dev/null || true
              git add data/*.json
              git commit --no-edit || true
            }
            sleep $((RANDOM % 5 + 2))
          done
          echo "❌ 5회 재시도 후에도 push 실패"
          exit 1
