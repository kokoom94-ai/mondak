name: collect-visitjeju

# 비짓제주 관광정보 수집 → data/visitjeju.json 커밋
# - 수동 실행(테스트)  + 매주 월요일 새벽 3시(KST 12시) 자동 갱신
on:
  workflow_dispatch:        # ← 깃허브 Actions 탭에서 "Run workflow"로 즉시 테스트
  schedule:
    - cron: '0 18 * * 0'    # 매주 일요일 18:00 UTC = 월요일 03:00 KST

permissions:
  contents: write           # data/visitjeju.json 커밋 권한

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect VisitJeju
        env:
          VISITJEJU_KEY: ${{ secrets.VISITJEJU_KEY }}
        run: node collect-visitjeju.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/visitjeju.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: update visitjeju.json ($(date -u +%Y-%m-%d))"
            git push
          fi
