name: 제주행사 수집

# 비짓제주 관광정보 OPEN API에서 축제·행사를 받아 data/festival.json 갱신.
# 키는 저장소 Secret VISITJEJU_KEY로만 전달한다 (코드·로그에 남기지 않는다).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 방식'
        type: choice
        default: collect
        options: [collect, probe]
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 KST

permissions:
  contents: write

concurrency:
  group: collect-festival
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 축제·행사 수집
        env:
          VISITJEJU_KEY: ${{ secrets.VISITJEJU_KEY }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "probe" ]; then
            python scripts/collect_festival.py --probe
          else
            python scripts/collect_festival.py
          fi

      - name: 변경사항 커밋
        if: ${{ github.event.inputs.mode != 'probe' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 파일이 없으면 그 파일만 건너뛴다
          for f in data/festival.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "제주행사 갱신 ($(date +%Y-%m-%d))"
          # 다른 수집 작업이 먼저 밀어 넣었으면 저장소가 앞서 있다 — 다시 맞춘 뒤 재시도
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push 재시도 $i"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME:-main} || true
            sleep 3
          done
          echo "push 실패 — 다음 실행에서 다시 시도합니다"
          exit 0
