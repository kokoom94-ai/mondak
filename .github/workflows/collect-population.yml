name: 제주 인구 수집

# 제주특별자치도 인구빅데이터(주민등록인구 및 등록외국인) 읍면동 현황.
# 월 단위로 갱신되는 자료라 하루 한 번이면 충분하다.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'   # 매일 05:00 KST

permissions:
  contents: write

concurrency:
  group: collect-population
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 인구 수집
        run: python scripts/collect_population.py
      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          test -f data/population.json || { echo "수집 결과 없음 — 커밋 생략"; exit 0; }
          # 파일이 없으면 그 파일만 건너뛴다
          for f in data/population.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "제주 인구 갱신 ($(date +%Y-%m-%d))"
          # 다른 수집 작업이 먼저 밀어 넣었으면 저장소가 앞서 있다 — 다시 맞춘 뒤 재시도
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push 재시도 $i"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME:-main} || true
            sleep 3
          done
          echo "push 실패 — 다음 실행에서 다시 시도합니다"
          exit 0
