name: 관광 데이터 수집

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 5 * *'   # 매월 6일 05:00 KST

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 관광 데이터 수집
        run: python scripts/collect_tourism.py
      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tourism.json
          git diff --staged --quiet || git commit -m "관광 데이터 자동 수집 $(date +'%Y-%m-%d')"
          git push
