name: 관광 데이터 수집

on:
  workflow_dispatch:
  schedule:
    - cron: '10 0,9 * * *'   # 매일 09:10 / 18:10 KST — 원천(제주관광 빅데이터 플랫폼)이
                             # 전일치를 오전 중 갱신하므로 오전·오후 두 번 받아온다

permissions:
  contents: write

concurrency:
  group: collect-tourism
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 관광 데이터 수집
        run: python scripts/collect_tourism.py
      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 파일이 없으면 그 파일만 건너뛴다
          for f in data/tourism.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "관광 데이터 자동 수집 $(date +'%Y-%m-%d')"
          # 다른 수집 작업이 먼저 밀어 넣었으면 저장소가 앞서 있다 — 다시 맞춘 뒤 재시도
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push 재시도 $i"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME:-main} || true
            sleep 3
          done
          echo "push 실패 — 다음 실행에서 다시 시도합니다"
          exit 0 origin main && exit 0
            echo "재시도 $i"
            sleep 5
          done
          echo "푸시 실패" && exit 1
