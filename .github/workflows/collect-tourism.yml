name: 관광 데이터 수집

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 5 * *'   # 매월 6일 05:00 KST

permissions:
  contents: write

concurrency:
  group: collect-tourism
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 관광 데이터 수집
        run: python scripts/collect_tourism.py
      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tourism.json
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "관광 데이터 자동 수집 $(date +'%Y-%m-%d')"
          # 원격이 앞서 있으면 최신을 받아 위에 얹고 재시도
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "재시도 $i"
            sleep 5
          done
          echo "푸시 실패" && exit 1
