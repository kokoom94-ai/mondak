name: 정부정책 브리핑 수집

# 대한민국 정책브리핑(korea.kr) 정책뉴스.
# 정책브리핑 RSS는 2026-07-01 중단되어 공개 검색 색인으로 제목·링크만 모은다.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22,10 * * *'   # 07:00 · 19:00 KST

permissions:
  contents: write

concurrency:
  group: collect-policybrief
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 정책브리핑 수집
        run: python scripts/collect_policybrief.py
      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/policybrief.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "정책브리핑 갱신 ($(date +%Y-%m-%d))"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push 재시도 $i"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME:-main} || true
            sleep 3
          done
          echo "push 실패 — 다음 실행에서 다시 시도합니다"
          exit 0
